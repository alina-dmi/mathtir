<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Математический тир</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1e3c72, #2a5298);
    color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px; user-select: none; overflow: hidden;
  }

  /* ===== Верхняя строка ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: nowrap;
    width: 100%; max-width: 420px;
    font-size: 0.9rem; opacity: 0.9; margin-bottom: 10px;
    min-height: 1.6rem;
    gap: 6px;
  }
  .topbar > span { white-space: nowrap; }
  .topbar .rank { color: #ffd93d; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .hearts { font-size: 1.1rem; letter-spacing: 2px; }

  /* ===== Пример ===== */
  .task {
    font-size: 3.4rem; font-weight: 800; letter-spacing: 1px;
    margin: 6px 0 28px; text-align: center;
    text-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: color 0.15s, transform 0.15s;
    min-height: 4.2rem;
  }
  .task.hit { color: #2ecc71; transform: scale(1.06); }

  /* ===== Ответы ===== */
  .answers {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; width: 100%; max-width: 420px;
  }
  .ball {
    padding: 26px 0; font-size: 1.9rem; font-weight: 600;
    border: none; border-radius: 18px; cursor: pointer;
    color: #fff; transition: transform 0.12s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.25);
    background: #4a7ec7;
  }
  .ball:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  .ball.correct { background: #2ecc71 !important; animation: pop 0.25s ease-out; }
  .ball.wrong   { background: #555 !important; opacity: 0.45; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* ===== Сообщение ===== */
  .msg {
    height: 1.6rem; margin-top: 14px;
    font-size: 1.1rem; font-weight: 700; text-align: center;
    opacity: 0; transition: opacity 0.15s;
  }
  .msg.show { opacity: 1; }

  /* ===== Кнопки ===== */
  .actions { margin-top: 16px; text-align: center; }
  .btn-main {
    padding: 13px 28px; font-size: 1rem; font-weight: 700;
    border: none; border-radius: 14px; cursor: pointer;
    background: #fff; color: #1e3c72;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    opacity: 0; transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .btn-main.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .link {
    display: block; margin: 12px auto 0;
    font-size: 0.85rem; color: rgba(255,255,255,0.7);
    background: none; border: none; cursor: pointer;
    text-decoration: underline; padding: 4px;
  }
  .link.secondary {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.5);
    margin-top: 6px;
  }

  /* ===== Меню ===== */
  #menu {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 420px;
  }
  #menu h1 {
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 6px;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  #menu h2 {
    font-size: 0.95rem;
    font-weight: 400;
    opacity: 0.65;
    margin: 0 0 24px;
    text-align: center;
  }

  .mode-btn {
    width: 100%;
    padding: 18px 20px;
    margin-bottom: 14px;
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.25);
    transition: transform 0.1s;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
  }
  .mode-btn:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  .mode-btn .sym {
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1;
    opacity: 0.9;
    min-width: 2.2rem;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mode-btn .sym svg {
    display: block;
    width: 22px;
    height: 22px;
  }
  .mode-btn .label { flex: 1; }
  #mode-addsub { background: #e63946; }
  #mode-muldiv { background: #2bb3a8; }
  #mode-all    { background: #e8890c; }

  /* ===== Подпись автора ===== */
  #menu .author {
    margin: 12px 0 0;
    font-size: 0.75rem;
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    text-align: center;
    letter-spacing: 0.3px;
    line-height: 1.4;
  }
  #menu .author b {
    font-weight: 600;
    color: rgba(255,255,255,0.55);
  }

  #game { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 420px; }
  #menu.hidden { display: none; }
  #game.visible { display: flex; }

  /* ===== ТОСТ ===== */
  #toast {
    position: fixed; top: 12px; left: 50%;
    width: min(92vw, 420px);
    display: flex; justify-content: center;
    pointer-events: none; z-index: 20;
    opacity: 0;
    transform: translateX(-50%) translateY(-16px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast-box {
    position: relative;
    width: 100%;
    min-height: 88px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 14px 18px; border-radius: 16px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    pointer-events: none;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.18);
  }
  .toast-box.rank-up {
    background: rgba(20, 30, 70, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: none;
    color: #fff;
    padding: 20px 22px 18px;
    box-shadow: 0 10px 28px -6px rgba(0,0,0,0.6);
  }
  .toast-box.rank-up::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(90deg, #ffd93d, #ffb800);
    animation: goldPulse 1.6s ease-in-out infinite;
  }
  @keyframes goldPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .toast-emoji { font-size: 1.8rem; line-height: 1; }
  .toast-box.rank-up .toast-emoji {
    font-size: 2.6rem;
    filter: drop-shadow(0 0 4px rgba(255, 215, 61, 0.35));
  }
  .toast-title { font-size: 1.05rem; font-weight: 800; margin-top: 4px; }
  .toast-box.rank-up .toast-title {
    font-size: 1.35rem;
    margin-top: 8px;
    color: #fff;
  }
  .toast-sub { font-size: 0.85rem; margin-top: 2px; opacity: 0.8; }
  .toast-box.rank-up .toast-sub {
    font-size: 0.95rem;
    margin-top: 6px;
    color: rgba(255,255,255,0.7);
    opacity: 1;
  }

  .confetti {
    position: fixed; top: -20px; width: 10px; height: 10px;
    border-radius: 2px; z-index: 15; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ===== Узкие экраны ===== */
  @media (max-width: 360px) {
    .topbar { font-size: 0.8rem; }
    .hearts { font-size: 0.95rem; letter-spacing: 1px; }
    .task { font-size: 2.9rem; }
    .ball { font-size: 1.6rem; padding: 22px 0; }
    .mode-btn { font-size: 1rem; padding: 16px 16px; }
    #menu .author { font-size: 0.7rem; }
  }
</style>
</head>
<body>

  <div id="menu">
    <h1>🎯 Математический тир</h1>
    <h2>Что будем тренировать?</h2>
    <button class="mode-btn" id="mode-addsub">
      <span class="sym">+ −</span>
      <span class="label">Сложение и вычитание</span>
    </button>
    <button class="mode-btn" id="mode-muldiv">
      <span class="sym">× ÷</span>
      <span class="label">Умножение и деление</span>
    </button>
    <button class="mode-btn" id="mode-all">
      <span class="sym">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="8.5" cy="8.5" r="1.2" fill="#fff" stroke="none"/>
          <circle cx="15.5" cy="8.5" r="1.2" fill="#fff" stroke="none"/>
          <circle cx="12" cy="12" r="1.2" fill="#fff" stroke="none"/>
          <circle cx="8.5" cy="15.5" r="1.2" fill="#fff" stroke="none"/>
          <circle cx="15.5" cy="15.5" r="1.2" fill="#fff" stroke="none"/>
        </svg>
      </span>
      <span class="label">Всё вместе</span>
    </button>

    <p class="author">
      Автор и создатель<br>
      <b>Алина Дмитриевна Оленева</b>
    </p>
  </div>

  <div id="game">
    <div class="topbar">
      <span>Счёт: <b id="score">0</b></span>
      <span class="hearts" id="hearts">❤️❤️❤️❤️❤️</span>
      <span class="rank" id="rank">🌱 Новичок</span>
    </div>

    <div class="task" id="task">…</div>
    <div class="answers" id="answers"></div>
    <div class="msg" id="msg"></div>

    <div class="actions">
      <button class="btn-main" id="continue">▶ Продолжить</button>
      <button class="link" id="restart">Начать заново</button>
      <button class="link secondary" id="back">← Сменить режим</button>
    </div>
  </div>

  <div id="toast"><div class="toast-box" id="toast-box">
    <div class="toast-emoji" id="toast-emoji"></div>
    <div class="toast-title" id="toast-title"></div>
    <div class="toast-sub" id="toast-sub"></div>
  </div></div>

<script>
  const MAX_LIVES = 5;
  let score = 0, lives = MAX_LIVES, answer = 0, locked = false;
  let currentMode = 'all';
  let currentDisplayKey = '';
  let recentTasks = [];
  const RECENT_LIMIT = 8;
  let wrongQueue = [];

  const $ = id => document.getElementById(id);
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const pick1 = arr => arr[rnd(0, arr.length - 1)];

  const RANKS = [
    { at: 0,   name: 'Новичок',              emoji: '🌱' },
    { at: 3,   name: 'Считатель',            emoji: '🔢' },
    { at: 5,   name: 'Умник',                emoji: '💡' },
    { at: 10,  name: 'Мастер счёта',         emoji: '🏆' },
    { at: 15,  name: 'Гений чисел',          emoji: '🧠' },
    { at: 20,  name: 'Профессор',            emoji: '🎓' },
    { at: 30,  name: 'Король математики',    emoji: '👑' },
    { at: 40,  name: 'Повелитель цифр',      emoji: '⚡' },
    { at: 50,  name: 'Суперсчётчик',         emoji: '🚀' },
    { at: 60,  name: 'Магистр формул',       emoji: '🔮' },
    { at: 70,  name: 'Легенда чисел',        emoji: '⭐' },
    { at: 80,  name: 'Алмазный ум',          emoji: '💎' },
    { at: 90,  name: 'Чемпион',              emoji: '🥇' },
    { at: 100, name: 'Абсолютный гений',     emoji: '🌟' },
  ];

  function rankFor(s) {
    let r = RANKS[0];
    for (const item of RANKS) if (s >= item.at) r = item;
    return r;
  }

  let toastTimer = null;
  function showToast(kind, emoji, title, sub) {
    const toast = $('toast');
    const box = $('toast-box');
    $('toast-emoji').textContent = emoji;
    $('toast-title').textContent = title;
    $('toast-sub').textContent = sub || '';
    box.className = 'toast-box' + (kind === 'rank' ? ' rank-up' : '');
    toast.classList.remove('show');
    void toast.offsetWidth;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function confetti(n) {
    const colors = ['#ff6b6b','#4ecdc4','#ffa62b','#9b5de5','#ffd93d','#2ecc71'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = rnd(0, 100) + 'vw';
      c.style.background = colors[rnd(0, colors.length - 1)];
      c.style.animationDuration = (1 + Math.random() * 1.2) + 's';
      c.style.animationDelay = (Math.random() * 0.3) + 's';
      c.style.width = c.style.height = rnd(6, 12) + 'px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2500);
    }
  }

  function updateHearts() {
    $('hearts').textContent = '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives);
  }

  const fmt = n => (n < 0 ? '−' + Math.abs(n) : '' + n);

  function buildTask() {
    let ops;
    if (currentMode === 'addsub') ops = ['+', '−'];
    else if (currentMode === 'muldiv') ops = ['×', '÷'];
    else ops = ['+', '−', '×', '÷'];

    const op = pick1(ops);
    let a, b, ans, display;
    if (op === '+') {
      a = rnd(1, 20); b = rnd(1, 20); ans = a + b;
      display = `${a} + ${b} = ?`;
    } else if (op === '−') {
      a = rnd(5, 20); b = rnd(1, a); ans = a - b;
      display = `${a} − ${b} = ?`;
    } else if (op === '×') {
      a = rnd(2, 10); b = rnd(2, 10); ans = a * b;
      display = `${a} × ${b} = ?`;
    } else {
      a = rnd(2, 10); b = rnd(2, 10);
      ans = a; display = `${a * b} ÷ ${b} = ?`;
    }
    return { display, answer: ans, key: display, op };
  }

  function restoreTask(key) {
    const m = key.match(/^(\d+)\s([+−×÷])\s(\d+)\s=/);
    if (!m) return null;
    const a = +m[1], op = m[2], b = +m[3];
    let ans;
    if (op === '+') ans = a + b;
    else if (op === '−') ans = a - b;
    else if (op === '×') ans = a * b;
    else ans = Math.round(a / b);
    return { display: key, answer: ans, key, op };
  }

  function makeTask() {
    let task = null;
    if (wrongQueue.length > 0 && Math.random() < 0.4) {
      const key = wrongQueue[Math.floor(Math.random() * wrongQueue.length)];
      const restored = restoreTask(key);
      if (restored) { task = restored; wrongQueue = wrongQueue.filter(k => k !== key); }
    }
    if (!task) {
      let attempts = 0;
      task = buildTask();
      while (recentTasks.includes(task.key) && attempts < 30) {
        task = buildTask(); attempts++;
      }
    }
    recentTasks.push(task.key);
    if (recentTasks.length > RECENT_LIMIT) recentTasks.shift();

    answer = task.answer;
    currentDisplayKey = task.key;
    $('task').textContent = task.display;
    $('task').classList.remove('hit');

    const opts = new Set([answer]);
    while (opts.size < 4) {
      let fake = (task.op === '×' || task.op === '÷') ? answer + rnd(-5, 5) : answer + rnd(-4, 4);
      if (fake > 0 && fake !== answer) opts.add(fake);
    }
    const arr = [...opts].sort(() => Math.random() - 0.5);

    const box = $('answers');
    box.innerHTML = '';
    arr.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'ball';
      btn.textContent = v;
      btn.onclick = () => pick(btn, v);
      box.appendChild(btn);
    });
    locked = false;
    $('msg').classList.remove('show');
  }

  function pick(btn, value) {
    if (locked) return;
    locked = true;
    if (value === answer) {
      const prevRank = rankFor(score);
      score++;
      $('score').textContent = score;
      btn.classList.add('correct');
      $('task').classList.add('hit');
      $('msg').textContent = '✅ Верно!';
      $('msg').style.color = '#2ecc71';
      $('msg').classList.add('show');

      const newRank = rankFor(score);
      $('rank').textContent = `${newRank.emoji} ${newRank.name}`;

      if (newRank.at > prevRank.at) {
        showToast('rank', newRank.emoji, `Новое звание: ${newRank.name}!`, `Правильных: ${score}`);
        confetti(40);
      } else if (score > 0 && score % 25 === 0) {
        showToast('praise', '🔥', `Уже ${score} правильных!`, 'Так держать!');
        confetti(30);
      } else if (score > 0 && score % 5 === 0) {
        showToast('praise', '🎉', `Молодец! ${score} правильных!`, '');
        confetti(20);
      }
      setTimeout(makeTask, 650);
    } else {
      lives--;
      updateHearts();
      btn.classList.add('wrong');
      $('msg').textContent = `❌ Правильно: ${answer}`;
      $('msg').style.color = '#ff6b6b';
      $('msg').classList.add('show');

      if (currentDisplayKey && !wrongQueue.includes(currentDisplayKey)) {
        wrongQueue.push(currentDisplayKey);
        if (wrongQueue.length > 10) wrongQueue.shift();
      }
      if (lives <= 0) setTimeout(gameOver, 900);
      else setTimeout(makeTask, 1200);
    }
  }

  function gameOver() {
    $('task').textContent = '🏁 Жизни кончились!';
    $('answers').innerHTML = '';
    const r = rankFor(score);
    $('msg').textContent = `Счёт: ${score} · ${r.emoji} ${r.name}`;
    $('msg').style.color = '#fff';
    $('msg').classList.add('show');
    $('continue').classList.add('visible');
  }

  function startGame(mode) {
    currentMode = mode;
    score = 0; lives = MAX_LIVES;
    recentTasks = []; wrongQueue = [];
    $('score').textContent = 0;
    updateHearts();
    $('rank').textContent = `${RANKS[0].emoji} ${RANKS[0].name}`;
    $('continue').classList.remove('visible');
    $('menu').classList.add('hidden');
    $('game').classList.add('visible');
    makeTask();
  }

  $('mode-addsub').onclick = () => startGame('addsub');
  $('mode-muldiv').onclick = () => startGame('muldiv');
  $('mode-all').onclick    = () => startGame('all');

  $('continue').onclick = () => {
    lives = MAX_LIVES; updateHearts();
    $('continue').classList.remove('visible');
    $('msg').classList.remove('show');
    makeTask();
  };

  $('restart').onclick = () => {
    score = 0; lives = MAX_LIVES;
    recentTasks = []; wrongQueue = [];
    $('score').textContent = 0; updateHearts();
    $('rank').textContent = `${RANKS[0].emoji} ${RANKS[0].name}`;
    $('continue').classList.remove('visible');
    $('msg').classList.remove('show');
    makeTask();
  };

  $('back').onclick = () => {
    $('game').classList.remove('visible');
    $('menu').classList.remove('hidden');
  };
</script>
</body>
</html>
